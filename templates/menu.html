<nav class="sl-navbar">
    <div class="sl-navbar-inner">

        <a class="sl-navbar-brand" href="{% url 'hotel' %}">
            {% load static %}
            <span class="sl-brand-mark">
                <img src="{% static 'img/logo.svg' %}" alt="StayLux" width="23" height="23">
            </span>
            <span class="sl-brand-name">staylux<span>.</span></span>
        </a>

        <button class="sl-navbar-toggler"
                type="button"
                aria-label="Відкрити меню"
                aria-expanded="false"
                aria-controls="slNavbarMenu">
            <span></span>
            <span></span>
        </button>

        <div class="sl-navbar-menu" id="slNavbarMenu">
            <a class="sl-navbar-link active" href="{% url 'hotel' %}">
                Головна
            </a>

            <a class="sl-navbar-cta" href="{% url 'hotel' %}#hotels">
                Знайти свій простір <span>↗</span>
            </a>
        </div>

    </div>
</nav>

<style>
    .sl-navbar {
        --nav-paper: #f5f2eb;
        --nav-ink: #202b25;
        --nav-green: #29483b;
        --nav-clay: #c87555;

        background: var(--nav-paper);
        color: var(--nav-ink);
        position: relative;
        z-index: 1000;
        width: 100%;
    }

    .sl-navbar,
    .sl-navbar * {
        box-sizing: border-box;
    }

    .sl-navbar-inner {
        width: min(1440px, calc(100% - 72px));
        min-height: 82px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        border-bottom: 1px solid rgba(32, 43, 37, .14);
    }

    .sl-navbar-brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        text-decoration: none;
        color: var(--nav-ink);
        flex-shrink: 0;
    }

    .sl-brand-mark {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(32, 43, 37, .45);
        border-radius: 50%;
        transition: transform .3s ease, background .3s ease;
    }

    .sl-brand-mark img {
        display: block;
        width: 23px;
        height: 23px;
        object-fit: contain;
    }

    .sl-navbar-brand:hover .sl-brand-mark {
        transform: rotate(-12deg);
        background: #e8e4d9;
    }

    .sl-brand-name {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -.075em;
    }

    .sl-brand-name span {
        color: var(--nav-clay);
    }

    .sl-navbar-menu {
        display: flex;
        align-items: center;
        gap: 34px;
    }

    .sl-navbar-link {
        color: #6f776f;
        font-size: 12px;
        text-decoration: none;
        position: relative;
        padding: 9px 0;
        transition: color .2s ease;
    }

    .sl-navbar-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 100%;
        bottom: 2px;
        height: 1px;
        background: var(--nav-clay);
        transition: right .25s ease;
    }

    .sl-navbar-link:hover,
    .sl-navbar-link.active {
        color: var(--nav-ink);
    }

    .sl-navbar-link:hover::after,
    .sl-navbar-link.active::after {
        right: 0;
    }

    .sl-navbar-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        border: 1px solid var(--nav-green);
        color: var(--nav-green);
        border-radius: 999px;
        padding: 12px 17px;
        font-size: 11px;
        text-decoration: none;
        white-space: nowrap;
        transition: background .25s ease, color .25s ease;
    }

    .sl-navbar-cta span {
        font-size: 15px;
        transition: transform .25s ease;
    }

    .sl-navbar-cta:hover {
        background: var(--nav-green);
        color: #fffdf8;
    }

    .sl-navbar-cta:hover span {
        transform: translate(2px, -2px);
    }

    .sl-navbar-toggler {
        display: none;
        border: 1px solid rgba(32, 43, 37, .2);
        background: transparent;
        border-radius: 50%;
        width: 43px;
        height: 43px;
        padding: 0;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
    }

    .sl-navbar-toggler span {
        display: block;
        height: 1px;
        width: 17px;
        background: var(--nav-ink);
        transition: transform .2s ease;
    }

    .sl-navbar-toggler[aria-expanded="true"] span:first-child {
        transform: translateY(3px) rotate(45deg);
    }

    .sl-navbar-toggler[aria-expanded="true"] span:last-child {
        transform: translateY(-3px) rotate(-45deg);
    }

    @media (max-width: 700px) {
        .sl-navbar-inner {
            width: calc(100% - 30px);
            min-height: 70px;
            flex-wrap: wrap;
            gap: 0;
            padding: 12px 0;
        }

        .sl-brand-name {
            font-size: 22px;
        }

        .sl-brand-mark {
            width: 35px;
            height: 35px;
        }

        .sl-navbar-toggler {
            display: flex;
        }

        .sl-navbar-menu {
            display: none;
            align-items: stretch;
            flex-direction: column;
            gap: 0;
            width: 100%;
            padding: 12px 0 5px;
        }

        .sl-navbar-menu.is-open {
            display: flex;
        }

        .sl-navbar-link {
            padding: 15px 3px;
            border-bottom: 1px solid rgba(32, 43, 37, .1);
        }

        .sl-navbar-link::after {
            display: none;
        }

        .sl-navbar-cta {
            align-self: flex-start;
            margin-top: 14px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .sl-navbar *,
        .sl-navbar *::before,
        .sl-navbar *::after {
            transition: none !important;
        }
    }
</style>

<script>
(function () {
    const navbar = document.querySelector('.sl-navbar');
    if (!navbar) return;

    const toggle = navbar.querySelector('.sl-navbar-toggler');
    const menu = navbar.querySelector('.sl-navbar-menu');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
        const isOpen = toggle.getAttribute('aria-expanded') === 'true';

        toggle.setAttribute('aria-expanded', String(!isOpen));
        menu.classList.toggle('is-open', !isOpen);
    });

    menu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
            toggle.setAttribute('aria-expanded', 'false');
            menu.classList.remove('is-open');
        });
    });
})();
</script>
