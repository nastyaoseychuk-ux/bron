{% load static %}
<nav class="sl-navbar" aria-label="Головна навігація">
    <div class="sl-navbar-inner">

        <a class="sl-navbar-brand" href="{% url 'hotel' %}">
            <span class="sl-brand-mark">
                <img src="{% static 'img/logo.svg' %}" alt="" width="23" height="23">
            </span>
            <span class="sl-brand-name">staylux<span>.</span></span>
        </a>

        <button class="sl-navbar-toggler"
                type="button"
                aria-label="Відкрити меню"
                aria-expanded="false"
                aria-controls="slNavbarMenu">
            <span></span>
            <span></span>
        </button>

        <div class="sl-navbar-menu" id="slNavbarMenu">
            <a class="sl-navbar-link{% if request.resolver_match.url_name == 'hotel' %} active{% endif %}" href="{% url 'hotel' %}">
                Головна
            </a>
            <a class="sl-navbar-link" href="{% url 'hotel' %}#hotels">
                Знайти свій простір
            </a>

            {% if user.is_authenticated %}
                <span class="sl-navbar-user" title="{{ user.get_username }}">
                    <span class="sl-navbar-avatar" aria-hidden="true">{{ user.get_username|first|upper }}</span>
                    <span class="sl-navbar-username">{{ user.get_username }}</span>
                </span>
                <a class="sl-navbar-btn sl-navbar-btn--ghost" href="{% url 'logout' %}">Вийти</a>
            {% else %}
                <a class="sl-navbar-btn" href="{% url 'login' %}">Увійти</a>
            {% endif %}
        </div>

    </div>
</nav>

<style>
    .sl-navbar {
        --nav-paper: #f5f2eb;
        --nav-white: #fffdf8;
        --nav-ink: #202b25;
        --nav-muted: #6f776f;
        --nav-green: #29483b;
        --nav-green-dark: #1c332a;
        --nav-lime: #d6e2a8;
        --nav-clay: #c87555;
        --nav-line: rgba(32, 43, 37, .14);

        background: var(--nav-paper);
        color: var(--nav-ink);
        font-family: inherit;
        position: relative;
        width: 100%;
        z-index: 1000;
    }

    .sl-navbar,
    .sl-navbar * { box-sizing: border-box; }

    .sl-navbar-inner {
        align-items: center;
        border-bottom: 1px solid var(--nav-line);
        display: flex;
        gap: 28px;
        justify-content: space-between;
        margin: 0 auto;
        min-height: 82px;
        width: min(1440px, calc(100% - 72px));
    }

    /* ---------- Brand ---------- */
    .sl-navbar-brand {
        align-items: center;
        color: var(--nav-ink);
        display: inline-flex;
        flex-shrink: 0;
        gap: 11px;
        text-decoration: none;
    }
    .sl-brand-mark {
        align-items: center;
        border: 1px solid rgba(32, 43, 37, .45);
        border-radius: 50%;
        display: flex;
        height: 38px;
        justify-content: center;
        transition: transform .3s ease, background .3s ease;
        width: 38px;
    }
    .sl-brand-mark img {
        display: block;
        height: 23px;
        object-fit: contain;
        width: 23px;
    }
    .sl-navbar-brand:hover .sl-brand-mark {
        background: #e8e4d9;
        transform: rotate(-12deg);
    }
    .sl-brand-name {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -.075em;
    }
    .sl-brand-name span { color: var(--nav-clay); }

    /* ---------- Menu ---------- */
    .sl-navbar-menu {
        align-items: center;
        display: flex;
        gap: 32px;
    }

    .sl-navbar-link {
        color: var(--nav-muted);
        font-size: 12px;
        padding: 9px 0;
        position: relative;
        text-decoration: none;
        transition: color .2s ease;
    }
    .sl-navbar-link::after {
        background: var(--nav-clay);
        bottom: 2px;
        content: "";
        height: 1px;
        left: 0;
        position: absolute;
        right: 100%;
        transition: right .25s ease;
    }
    .sl-navbar-link:hover,
    .sl-navbar-link.active { color: var(--nav-ink); }
    .sl-navbar-link:hover::after,
    .sl-navbar-link.active::after { right: 0; }

    /* the only button in the header */
    .sl-navbar-btn {
        align-items: center;
        background: var(--nav-green);
        border: 1px solid var(--nav-green);
        border-radius: 999px;
        color: #fff;
        display: inline-flex;
        font-size: 12px;
        justify-content: center;
        padding: 11px 22px;
        text-decoration: none;
        transition: background .25s ease, color .25s ease, transform .25s ease;
        white-space: nowrap;
    }
    .sl-navbar-btn:hover { background: var(--nav-green-dark); transform: translateY(-1px); }

    .sl-navbar-btn--ghost {
        background: transparent;
        color: var(--nav-green);
    }
    .sl-navbar-btn--ghost:hover { background: var(--nav-green); color: var(--nav-white); }

    .sl-navbar a:focus-visible,
    .sl-navbar-toggler:focus-visible {
        outline: 2px solid var(--nav-clay);
        outline-offset: 3px;
    }

    /* user */
    .sl-navbar-user {
        align-items: center;
        display: inline-flex;
        font-size: 12px;
        gap: 10px;
    }
    .sl-navbar-avatar {
        align-items: center;
        background: var(--nav-lime);
        border-radius: 50%;
        color: var(--nav-green-dark);
        display: inline-flex;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        height: 34px;
        justify-content: center;
        width: 34px;
    }
    .sl-navbar-username {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ---------- Toggler ---------- */
    .sl-navbar-toggler {
        align-items: center;
        background: transparent;
        border: 1px solid rgba(32, 43, 37, .2);
        border-radius: 50%;
        cursor: pointer;
        display: none;
        flex-direction: column;
        gap: 5px;
        height: 43px;
        justify-content: center;
        padding: 0;
        width: 43px;
    }
    .sl-navbar-toggler span {
        background: var(--nav-ink);
        display: block;
        height: 1px;
        transition: transform .2s ease;
        width: 17px;
    }
    .sl-navbar-toggler[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
    .sl-navbar-toggler[aria-expanded="true"] span:last-child { transform: translateY(-3px) rotate(-45deg); }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
        .sl-navbar-inner { width: calc(100% - 40px); }
        .sl-navbar-menu { gap: 22px; }
        .sl-navbar-username { display: none; }
    }

    @media (max-width: 700px) {
        .sl-navbar-inner {
            flex-wrap: wrap;
            gap: 0;
            min-height: 70px;
            padding: 12px 0;
            width: calc(100% - 30px);
        }
        .sl-brand-name { font-size: 22px; }
        .sl-brand-mark { height: 35px; width: 35px; }
        .sl-navbar-toggler { display: flex; }

        .sl-navbar-menu {
            align-items: stretch;
            display: none;
            flex-direction: column;
            gap: 0;
            padding: 8px 0 6px;
            width: 100%;
        }
        .sl-navbar-menu.is-open { display: flex; }

        .sl-navbar-link,
        .sl-navbar-user {
            border-bottom: 1px solid rgba(32, 43, 37, .1);
            font-size: 14px;
            padding: 16px 2px;
        }
        .sl-navbar-link::after { display: none; }
        .sl-navbar-link.active { color: var(--nav-ink); }
        .sl-navbar-username { display: inline; max-width: none; }

        .sl-navbar-btn {
            align-self: flex-start;
            font-size: 13px;
            margin: 16px 0 6px;
            padding: 11px 26px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .sl-navbar *,
        .sl-navbar *::before,
        .sl-navbar *::after { transition: none !important; }
    }
</style>

<script>
(function () {
    const navbar = document.querySelector('.sl-navbar');
    if (!navbar) return;

    const toggle = navbar.querySelector('.sl-navbar-toggler');
    const menu = navbar.querySelector('.sl-navbar-menu');
    if (!toggle || !menu) return;

    function setOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Закрити меню' : 'Відкрити меню');
        menu.classList.toggle('is-open', open);
    }

    toggle.addEventListener('click', function () {
        setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });

    menu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () { setOpen(false); });
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
    });
})();
</script>
